<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Markdown 预览</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      body {
        overflow: auto;
        height: auto;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 16px 60px;
      }
      .bar {
        display: flex;
        gap: 8px;
        padding: 10px 0 16px;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 2;
      }
      #perfout {
        font-size: 12px;
        color: var(--text-2);
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar">
        <button class="btn" id="theme">切换主题</button>
        <button class="btn" id="perf">渲染耗时</button>
        <span id="perfout"></span>
      </div>
      <div class="md" id="out"></div>
    </div>
    <script type="module">
      import { render } from '/js/md.js'
      import { SAMPLE } from '/js/sample-md.js'

      const out = document.getElementById('out')
      out.innerHTML = render(SAMPLE)

      document.getElementById('theme').onclick = () => {
        const root = document.documentElement
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
      }

      document.getElementById('perf').onclick = () => {
        const big = SAMPLE.repeat(10)
        const t0 = performance.now()
        for (let i = 0; i < 20; i++) render(big)
        const ms = (performance.now() - t0) / 20
        document.getElementById('perfout').textContent =
          big.length + ' 字符文档，平均 ' + ms.toFixed(2) + 'ms/次'
      }
    </script>
  </body>
</html>
