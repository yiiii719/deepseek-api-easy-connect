<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1114" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>潮汐 · 本地 AI 客户端</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="btn-drawer" aria-label="历史对话">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h11M4 17.5h7" /></svg>
        </button>
        <div class="topbar-title" id="top-title">
          <span class="mark-sm" aria-hidden="true"></span>
          <span class="brand">潮汐</span>
        </div>
        <button class="mode-chip" id="mode-chip" hidden>演示</button>
        <button class="new-btn" id="btn-new">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          <span>新对话</span>
        </button>
      </header>

      <main class="scroller" id="scroller">
        <div class="thread" id="thread"></div>
        <button class="scroll-bottom" id="scroll-bottom" aria-label="回到底部">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
        </button>
      </main>

      <footer class="composer-zone" id="composer-zone">
        <div class="attach-row" id="attach-row"></div>
        <div class="composer" id="composer">
          <div class="composer-top">
            <button class="icon-btn slim" id="chip-attach" aria-label="上传文件">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <textarea id="input" rows="1" placeholder="问点什么…" enterkeyhint="send" autocomplete="off" autocapitalize="off"></textarea>
          </div>
          <div class="composer-bar">
            <div class="chips" id="chips">
              <button class="chip chip-toggle" data-toggle="thinking">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.9 8l4.6 1.9-4.6 1.9L12 16.4l-1.9-4.6L5.5 9.9 10.1 8z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>
                <span>深度思考</span>
              </button>
              <button class="chip chip-toggle" data-toggle="search">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
                <span>联网</span>
              </button>
            </div>
            <div class="send-zone">
              <button class="icon-btn slim" id="btn-mic" aria-label="语音输入">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="10" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3"/></svg>
              </button>
              <button class="send-btn" id="btn-send" aria-label="发送" disabled>
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="hint">本地运行 · 内容由模型生成，请自行核对</div>
      </footer>
    </div>

    <!-- 抽屉：历史对话（深色侧栏，与正文强对比） -->
    <div class="drawer-mask" id="drawer-mask"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-brand">
        <span class="mark"></span>
        <div>
          <b>潮汐</b>
          <i>本地 AI 客户端</i>
        </div>
      </div>
      <button class="btn-primary" id="btn-new-2">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        <span>开一个新话题</span>
      </button>
      <div class="drawer-search">
        <input id="conv-search" type="search" placeholder="搜索历史" />
      </div>
      <div class="conv-list" id="conv-list"></div>
      <div class="drawer-foot">
        <button class="drawer-item" id="btn-settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
          <span>设置</span>
        </button>
        <div class="drawer-version" id="drawer-version">v1.0.0</div>
      </div>
    </aside>

    <!-- 设置 -->
    <section class="sheet" id="sheet" aria-hidden="true">
      <header class="sheet-head">
        <button class="icon-btn" id="sheet-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <h2>设置</h2>
        <span style="width: 40px"></span>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="toast" id="toast"></div>
    <input type="file" id="file-input" multiple hidden accept=".txt,.md,.csv,.json,.pdf,.docx,.xlsx,.pptx,.log,.js,.ts,.py,.java,.kt,.go,.rs,.c,.cpp,.html,.css,.sql,.yaml,.yml" />
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
